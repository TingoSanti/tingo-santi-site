[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Página da palestra (URL principal)
[[redirects]]
  from = "/palestra"
  to = "/palestra.html"
  status = 200

[[redirects]]
  from = "/palestra/"
  to = "/palestra.html"
  status = 200

# URL antiga /ia -> /palestra (301 permanente, preserva query/UTM)
[[redirects]]
  from = "/ia"
  to = "/palestra"
  status = 301

[[redirects]]
  from = "/ia/"
  to = "/palestra"
  status = 301

# Rotas de contato do show (inalteradas)
[[redirects]]
  from = "/ds1"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ds1/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tinavalente"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tinavalente/"
  to = "/index.html"
  status = 200
