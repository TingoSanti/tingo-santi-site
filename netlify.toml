[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://w.behold.so https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com; connect-src 'self' https://formspree.io https://*.formspree.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://w.behold.so https://*.behold.so; form-action 'self' https://formspree.io"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[redirects]]
  from = "/palestra"
  to = "/palestra.html"
  status = 200

[[redirects]]
  from = "/palestra/"
  to = "/palestra.html"
  status = 200

[[redirects]]
  from = "/ia"
  to = "/palestra"
  status = 301

[[redirects]]
  from = "/ia/"
  to = "/palestra"
  status = 301

[[redirects]]
  from = "/ds1"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ds1/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tinavalente"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tinavalente/"
  to = "/index.html"
  status = 200
